<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600" role="img" aria-labelledby="title desc"><title id="title">Day 04：Op と EventMsg — お願いと報告を分ける</title><desc id="desc">要求は Core へ、出来事は UI へ。これは内部 Protocol の概念図。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#28635c" stroke-width="1.6"/></marker></defs><rect width="660" height="600" rx="12" fill="#f6f2e9"/><text x="108" y="65" fill="#263b37" font-family="sans-serif" font-size="26" font-weight="700">Op と EventMsg</text><path d="M32 102H628" stroke="#cdc9bd"/><text x="32" y="65" fill="#b14732" font-family="sans-serif" font-size="22" font-weight="700">図04</text><rect x="32" y="150" width="282" height="138" rx="8" fill="#ffffff" stroke="#b7c4bb"/><text x="52" y="179" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">01</text><text x="52" y="209" fill="#28635c" font-family="sans-serif" font-size="18" font-weight="700">UI</text><text x="52" y="244" fill="#263b37" font-family="sans-serif" font-size="19">操作を受け取る</text><rect x="346" y="150" width="282" height="138" rx="8" fill="#e5eeea" stroke="#b7c4bb"/><text x="366" y="179" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">02</text><text x="366" y="209" fill="#28635c" font-family="sans-serif" font-size="18" font-weight="700">OP</text><text x="366" y="244" fill="#263b37" font-family="sans-serif" font-size="19">してほしいこと</text><rect x="346" y="422" width="282" height="138" rx="8" fill="#ffffff" stroke="#b7c4bb"/><text x="366" y="451" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">03</text><text x="366" y="481" fill="#28635c" font-family="sans-serif" font-size="18" font-weight="700">CORE</text><text x="366" y="516" fill="#263b37" font-family="sans-serif" font-size="19">処理・状態変更</text><rect x="32" y="422" width="282" height="138" rx="8" fill="#efe4ce" stroke="#b7c4bb"/><text x="52" y="451" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">04</text><text x="52" y="481" fill="#28635c" font-family="sans-serif" font-size="18" font-weight="700">EVENTMSG</text><text x="52" y="516" fill="#263b37" font-family="sans-serif" font-size="19">起きたことを報告</text><path d="M314 219H338" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M487 288V414" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M346 491H322" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M173 422V300" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="330" y="360" text-anchor="middle" fill="#28635c" font-family="sans-serif" font-size="23">状態を見て、次へ進む</text></svg>