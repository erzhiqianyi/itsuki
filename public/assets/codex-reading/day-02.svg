<svg xmlns="http://www.w3.org/2000/svg" width="660" height="710" viewBox="0 0 660 710" role="img" aria-labelledby="title desc"><title id="title">Day 02：Coding Agent を、6つの役割に分けてみる</title><desc id="desc">Core から Model と Tools へ。Protocol は部品間の共通言語で、図の矢印を支える。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#28635c" stroke-width="1.6"/></marker></defs><rect width="660" height="710" rx="12" fill="#f6f2e9"/><text x="108" y="65" fill="#263b37" font-family="sans-serif" font-size="26" font-weight="700">Coding Agent を、6つの役割に分けてみる</text><path d="M32 102H628" stroke="#cdc9bd"/><text x="32" y="65" fill="#b14732" font-family="sans-serif" font-size="22" font-weight="700">図02</text><rect x="160" y="132" width="340" height="112" rx="8" fill="#ffffff" stroke="#b7c4bb"/><text x="180" y="161" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">01</text><text x="180" y="191" fill="#28635c" font-family="sans-serif" font-size="23" font-weight="700">CLI / TUI</text><text x="180" y="226" fill="#263b37" font-family="sans-serif" font-size="27">入口と操作画面</text><rect x="160" y="296" width="340" height="112" rx="8" fill="#e5eeea" stroke="#b7c4bb"/><text x="180" y="325" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">02</text><text x="180" y="355" fill="#28635c" font-family="sans-serif" font-size="23" font-weight="700">CORE</text><text x="180" y="390" fill="#263b37" font-family="sans-serif" font-size="27">作業の進行を管理</text><rect x="32" y="505" width="282" height="126" rx="8" fill="#ffffff" stroke="#b7c4bb"/><text x="52" y="534" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">03</text><text x="52" y="564" fill="#28635c" font-family="sans-serif" font-size="18" font-weight="700">MODEL</text><text x="52" y="599" fill="#263b37" font-family="sans-serif" font-size="19">次の行動を判断</text><rect x="346" y="505" width="282" height="126" rx="8" fill="#efe4ce" stroke="#b7c4bb"/><text x="366" y="534" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">04</text><text x="366" y="564" fill="#28635c" font-family="sans-serif" font-size="18" font-weight="700">TOOLS</text><text x="366" y="599" fill="#263b37" font-family="sans-serif" font-size="19">外部の操作を実行</text><path d="M330 244V288" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 408V462H172V496" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 408V462H486V496" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="330" y="678" text-anchor="middle" fill="#28635c" font-family="sans-serif" font-size="21">Protocol：部品のあいだの共通言語</text></svg>