<svg xmlns="http://www.w3.org/2000/svg" width="660" height="710" viewBox="0 0 660 710" role="img" aria-labelledby="title desc"><title id="title">Day 27：Failure Injection — 失敗を、狙った場所で起こす</title><desc id="desc">失敗を起こした瞬間だけでなく、その後に作業が進めるかまで見る。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#28635c" stroke-width="1.6"/></marker></defs><rect width="660" height="710" rx="12" fill="#f6f2e9"/><text x="108" y="65" fill="#263b37" font-family="sans-serif" font-size="26" font-weight="700">Failure Injection</text><path d="M32 102H628" stroke="#cdc9bd"/><text x="32" y="65" fill="#b14732" font-family="sans-serif" font-size="22" font-weight="700">図27</text><rect x="44" y="124" width="572" height="112" rx="8" fill="#ffffff" stroke="#b7c4bb"/><text x="64" y="153" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">01</text><text x="64" y="183" fill="#28635c" font-family="sans-serif" font-size="23" font-weight="700">VALID STATE</text><text x="64" y="218" fill="#263b37" font-family="sans-serif" font-size="27">現実に作れる状態</text><path d="M330 236V257" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="264" width="572" height="112" rx="8" fill="#e5eeea" stroke="#b7c4bb"/><text x="64" y="293" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">02</text><text x="64" y="323" fill="#28635c" font-family="sans-serif" font-size="23" font-weight="700">FAILURE SEAM</text><text x="64" y="358" fill="#263b37" font-family="sans-serif" font-size="27">狙った境界で失敗</text><path d="M330 376V397" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="404" width="572" height="112" rx="8" fill="#ffffff" stroke="#b7c4bb"/><text x="64" y="433" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">03</text><text x="64" y="463" fill="#28635c" font-family="sans-serif" font-size="23" font-weight="700">RECOVERY</text><text x="64" y="498" fill="#263b37" font-family="sans-serif" font-size="27">必要な状態を復元</text><path d="M330 516V537" fill="none" stroke="#28635c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="544" width="572" height="112" rx="8" fill="#efe4ce" stroke="#b7c4bb"/><text x="64" y="573" fill="#b14732" font-family="sans-serif" font-size="15" font-weight="700">04</text><text x="64" y="603" fill="#28635c" font-family="sans-serif" font-size="23" font-weight="700">LIFECYCLE</text><text x="64" y="638" fill="#263b37" font-family="sans-serif" font-size="27">その後の進行を確認</text></svg>